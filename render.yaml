services:
  - type: web
    name: anatomy-cosmetology
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://anatomy-cosmetology.onrender.com
      - key: SESSION_SECRET
        generateValue: true
