<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Клиенты — Анатомия косметики</title><link rel="stylesheet" href="/crm.css"></head><body>
<main class="crm-shell"><header class="crm-topbar"><a class="crm-brand" href="/">Анатомия косметики</a><nav class="crm-nav"><a href="/">Анализатор</a><a href="/clients" aria-current="page">Клиенты</a><a href="/calendar">Календарь</a><a href="/profile">Профиль</a></nav></header>
<section class="crm-page-head"><div><h1>Клиенты</h1><p>Персональные карты, визиты и контрольные осмотры</p></div><button class="crm-button" id="addClient">Добавить клиента</button></section>
<form class="crm-toolbar" id="filters"><input name="q" type="search" placeholder="ФИО, телефон или email" aria-label="Поиск"><input name="lastVisit" type="date" aria-label="Последний визит"><input name="nextVisit" type="date" aria-label="Следующий визит"><select name="sort" aria-label="Сортировка"><option value="name">По алфавиту</option><option value="last">По последнему визиту</option><option value="next">По следующему визиту</option></select><div class="crm-checks"><label class="crm-check"><input type="checkbox" name="hasContraindications">Есть противопоказания</label><label class="crm-check"><input type="checkbox" name="followUp">Требуется осмотр</label><label class="crm-check"><input type="checkbox" name="noVisits">Нет визитов</label></div></form>
<nav class="alphabet" id="alphabet" aria-label="Алфавитный указатель"></nav><section class="client-list" id="clientList"><div class="loading">Загружаем карточки…</div></section>
</main>
<dialog id="clientDialog"><form class="dialog-body crm-form" id="clientForm"><div class="dialog-head"><h2>Новый клиент</h2><button type="button" class="icon-button" data-close aria-label="Закрыть">×</button></div><div class="crm-grid"><label class="crm-field full">ФИО<input name="fullName" required autocomplete="name"></label><label class="crm-field">Дата рождения<input name="birthDate" type="date"></label><label class="crm-field">Телефон<input name="phone" type="tel" autocomplete="tel"></label><label class="crm-field">Email<input name="email" type="email" autocomplete="email"></label><label class="crm-field full">Внутренняя заметка<textarea name="internalNote" placeholder="Не будет видна клиенту"></textarea></label></div><div class="form-actions"><button type="button" class="crm-button secondary" data-close>Отмена</button><button class="crm-button">Создать карточку</button></div></form></dialog>
<div class="toast" id="toast" hidden></div><script src="/clients.js" type="module"></script></body></html>
